<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Image Slideshow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <script defer src="script.js"></script>
</head>

<body>
  <div class="container text-center">
    <div id="image-container" class="mt-5 mb-5">
      <h1 class="mb-4">Image Gallery</h1>
      <img id="image" alt="photo" />
    </div>
    <div class="mt-3">
      <button id="prev-btn" class="btn btn-secondary mr-2">Previous</button>
      <button id="next-btn" class="btn btn-secondary">Next</button>
    </div>
  </div>
</body>

</html>
