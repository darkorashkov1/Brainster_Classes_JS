<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 01</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
</head>

<body class="container p-5">
  <h1 class="text-center mb-4">Event Countdown Timer</h1>
  <div id="countdown" class="text-center font-weight-bold mb-3">
    <span id="days"></span> days, <span id="hours"></span> hours,
    <span id="minutes"></span> minutes, <span id="seconds"></span> seconds
  </div>
  <div class="text-center">
    <input type="datetime-local" id="newEventDate" class="form-control mb-2" />
    <button id="resetTimer" class="btn btn-primary">
      Set New Event Date
    </button>
  </div>

  <script>
    //Write the class logic here

    const button = document.querySelector('#resetTimer')

    const DAY_IN_MILLISECONDS = 1000 * 60 * 60 * 24;
    const HOUR_IN_MILLISECONDS = 1000 * 60 * 60;
    const MINUTE_IN_MILLISECONDS = 1000 * 60;
    const SECONDS_IN_MILLISECONDS = 1000;

    class CountdownTimer {
      constructor(eventDate, elements) {
        this.eventDate = new Date(eventDate);
        this.elements = elements;
        this.interval = setInterval(() => this.updatedCountdown(), 1000);
      }

      updatedCountdown() {
        const now = new Date();

        const timeLeft = this.eventDate - now;

        const days = Math.floor(timeLeft / DAY_IN_MILLISECONDS)
        const hours = Math.floor(timeLeft % DAY_IN_MILLISECONDS / HOUR_IN_MILLISECONDS)
        const minutes = Math.floor(timeLeft % HOUR_IN_MILLISECONDS / MINUTE_IN_MILLISECONDS)
        const seconds = Math.floor(timeLeft % MINUTE_IN_MILLISECONDS / SECONDS_IN_MILLISECONDS)

        this.elements.days.innerText = days;
        this.elements.hours.innerText = hours;
        this.elements.minutes.innerText = minutes;
        this.elements.seconds.innerText = seconds;
      }

      resetTimer() {
        const newDate = document.querySelector('#newEventDate')

        this.eventDate = new Date(newDate.value)
        this.updatedCountdown()
      }
    }
    // Initialize the countdown timer
    const elements = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds'),
    };

    const countdownTimer = new CountdownTimer(
      '2026-01-10T00:00:00',
      elements
    );

    button.addEventListener('click', () => { countdownTimer.resetTimer() })
  </script>
</body>

</html>
