<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentorship 05</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <style>
    .zoomed:hover {
      transform: scale(1.2);
      transition: transform 0.3s ease-in-out;
    }
  </style>

</head>

<body>
  <div class="container my-5 text-center">
    <div class="row">
      <div class="col mb-5">
        <h1>Insights</h1>
      </div>
    </div>
    <div class="row">
      <div class="col-10 offset-1">
        <div class="row">
          <div class="col filters">
            <h2 class="h3 mb-3">Filter by number of likes</h2>
            <button class="btn btn-secondary" id="showAll">Show all</button>
            <button id="lessThan50" class="btn btn-warning">
              < 50</button>
                <button id="between50And150" class="btn btn-info">
                  50 - 150
                </button>
                <button id="moreThan150" class="btn btn-dark">> 150</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="row article-wrapper"></div>
  </div>
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
</body>

</html>
