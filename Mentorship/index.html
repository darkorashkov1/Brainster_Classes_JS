<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentorship 07</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container mt-5">
    <h2>Add Book</h2>
    <div class="form-group">
      <input type="text" id="title" class="form-control" placeholder="Title" />
      <input type="text" id="author" class="form-control mt-2" placeholder="Author" />
      <input type="text" id="category" class="form-control mt-2" placeholder="Category" />
      <button id="addButton" class="btn btn-primary mt-2">
        Add Book
      </button>
    </div>
    <div class="form-group">
      <input type="text" id="filterCategory" class="form-control mt-2" placeholder="Filter by Category" />
      <button id="filterButton" class="btn btn-info mt-2">
        Filter Books
      </button>
    </div>
    <h2>Book List</h2>
    <div class="container">
      <div id="bookList" class="row row-cols-md-3"></div>
    </div>
  </div>


  <script src="./script.js"></script>
</body>

</html>
