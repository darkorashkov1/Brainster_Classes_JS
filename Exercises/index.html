<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercises</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    nav {
      margin-bottom: 20px;
    }

    nav button {
      margin-right: 10px;
      padding: 10px 20px;
    }

    .active {
      font-weight: bold;
    }

    li {
      list-style: none;
      margin: 5px 0;
    }

    input {
      margin-bottom: 10px;
      padding: 5px;
      width: 200px;
    }
  </style>

</head>

<body>

  <nav>
    <button id="homeBtn" class="active">Home</button>
    <button id="aboutBtn">About</button>
    <button id="contactBtn">Contact</button>
  </nav>

  <div id="homePage">
    <input type="text" id="searchInput" placeholder="Search people by name">
    <ul id="peopleList"></ul>
  </div>
  <div id="aboutPage" style="display:none;">
    <h2>About</h2>
    <p>This is a demo About page.</p>
  </div>
  <div id="contactPage" style="display:none;">
    <h2>Contact</h2>
    <p>This is a demo Contact page.</p>
  </div>

  <script src="./script.js"></script>
</body>

</html>
