<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 10</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
</head>

<body>
  <form class="container" id="containerForm">
    <h2 class="mt-4">Currency Converter</h2>
    <div class="form-group mt-3">
      <label for="amount">Amount:</label>
      <input type="number" id="amount" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="fromCurrency">From:</label>
      <select id="fromCurrency" class="form-control">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="MKD">MKD</option>
        <!-- Add other currencies as needed -->
      </select>
    </div>
    <div class="form-group">
      <label for="toCurrency">To:</label>
      <select id="toCurrency" class="form-control">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="MKD">MKD</option>
        <!-- Add other currencies as needed -->
      </select>
    </div>
    <button type="submit" id="convertButton" class="btn btn-primary">Convert</button>

    <div id="result" class="mt-3"></div>
    <script src="./exercise-10.js"></script>
</body>

</html>
